# BeatVox on Netlify: beatvox.app (the site is beatvox-lab; beatvox-lab.netlify.app redirects). Page routes are in
# public/_redirects; the share page's link preview is an edge function.
[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "22"
